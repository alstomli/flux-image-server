name: Publish immutable image
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable release version (for example 0.1.0)
        required: true
permissions:
  contents: read
concurrency:
  group: flux-image-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require Docker Hub publishing credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]] || { echo 'Set DOCKER_USERNAME and DOCKER_PASSWORD in this repository Actions secrets.' >&2; exit 1; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-cpu.txt -e '.[test]'
      - run: python -m pytest
      - name: Require public repository and unused release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          python scripts/registry_images.py require-unused "$VERSION"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Install verified registry inspection tool
        run: |
          python scripts/install_crane.py "$RUNNER_TEMP/flux-tools"
          echo "$RUNNER_TEMP/flux-tools" >> "$GITHUB_PATH"
      - name: Require unused version immediately before publication
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          python scripts/registry_images.py require-unused "$VERSION"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: zihan000/flux-inference:${{ inputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Record deployment digest
        env:
          IMAGE: docker.io/zihan000/flux-inference
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python scripts/registry_images.py verify-public "$IMAGE@$DIGEST"
          echo "Deploy \`$IMAGE@$DIGEST\` after GPU verification; anonymous Docker Hub pull passed." >> "$GITHUB_STEP_SUMMARY"
