name: Publish immutable image
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable release version (for example 0.1.0)
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: flux-image-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-cpu.txt -e '.[test]'
      - run: python -m pytest
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate new version
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if docker buildx imagetools inspect "$IMAGE:$VERSION" 2> /tmp/manifest-error; then
            echo 'Release tag already exists; choose a new version.' >&2
            exit 1
          fi
          grep -Eiq 'manifest unknown|not found' /tmp/manifest-error || { cat /tmp/manifest-error >&2; exit 1; }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Record deployment digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Deploy \`$IMAGE@$DIGEST\` after GPU smoke verification." >> "$GITHUB_STEP_SUMMARY"
